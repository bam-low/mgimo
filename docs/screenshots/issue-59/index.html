overflow": {"document": false, "workspace": false}, "scroll": false, "phase": "after", "sha256": "c14a5028ef89faf6d9a467c55d952e4ecba4749e2af1c5f37b09c2d65637faa0"}, {"headerOverlap": false, "screen": "today", "state": "break", "width": 1280, "height": 900, "file": "after/today-break-1280.png", "overflow": {"document": false, "workspace": false}, "scroll": false, "phase": "after", "sha256": "5c7e5ceda85b55de72f49d1fc23a80a750cfad2a097357cce6a33bb3b7af2be7"}, {"headerOverlap": false, "screen": "today", "state": "empty", "width": 1280, "height": 900, "file": "after/today-empty-1280.png", "overflow": {"document": false, "workspace": false}, "scroll": false, "phase": "after", "sha256": "1b8c64c3b911353efd4525418e6671a490e458f11892651fc7d550784f4b119d"}];const labels={"landing": "Приветствие", "login": "Вход", "today": "Главная", "schedule": "Расписание", "profile": "Профиль"};const states={"default": "Основной экран", "ended": "Занятия закончились", "week": "Неделя", "day": "День", "before": "До занятий", "current": "Текущая пара", "break": "Перемена", "empty": "Пустой день"};function render(){const width=document.querySelector('#width').value,screen=document.querySelector('#screen').value;const filtered=rows.filter(r=>!r.scroll&&(width==='all'||r.width===+width)&&(screen==='all'||r.screen===screen));const keys=[...new Set(filtered.map(r=>[r.screen,r.state,r.width].join('|')))];document.querySelector('#gallery').innerHTML=keys.map(key=>{const [s,state,w]=key.split('|');return `<article><h2>${labels[s]} · ${states[state]} · ${w}px</h2><div class="pair">`+['before','after'].map(phase=>{const r=filtered.find(r=>r.screen===s&&r.state===state&&r.width===+w&&r.phase===phase);return `<figure><figcaption>${phase==='before'?'До':'После'}</figcaption><a href="${r.file}" target="_blank"><img loading="lazy" src="${r.file}" alt="${labels[s]} ${w}px ${phase}"></a></figure>`}).join('')+'</div></article>'}).join('')}document.querySelectorAll('select').forEach(s=>s.addEventListener('change',render));render();</script></html>
